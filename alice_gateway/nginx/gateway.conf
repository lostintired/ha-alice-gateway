# Рабочий фильтр перед Home Assistant (решения 1–5 design.md alice-cloud-entry).
# Пропускает в HA только белый список «МЕТОД путь», сверка по сырому $request_uri; остальное — пустой 403.
# @PUBLIC_HOST@ и файлы в /tmp/agw/ подставляет run.sh.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    server_tokens off;
    map_hash_bucket_size 128;
    default_type text/plain;
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    large_client_header_buffers 4 8k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # Адрес клиента — только X-Real-IP от роутера; роутер его перезаписывает (зонд 1.2).
    set_real_ip_from 192.168.1.1;
    real_ip_header X-Real-IP;

    # Сырой путь без строки запроса; признак строки запроса.
    map $request_uri $raw_path {
        "~^(?<p>[^?]*)" $p;
        default "";
    }
    map $request_uri $has_query {
        "~\?" 1;
        default 0;
    }

    # Допустимый путь: сегменты из [A-Za-z0-9_.-], без "." и ".." и без пустых сегментов.
    # Любой %, \, ;, //, абсолютный URI — не проходят.
    map $raw_path $path_ok {
        "~(^|/)\.\.?(/|$)" 0;
        "~^(/[A-Za-z0-9_.-]+)+$" 1;
        default 0;
    }

    # Схема клиента — https и только со слов роутера; прямой заход из LAN на порт фильтра не проходит.
    map "$realip_remote_addr|$http_x_forwarded_proto" $proto_ok {
        "192.168.1.1|https" 1;
        default 0;
    }

    # Websocket и прочие Upgrade — отказ.
    map $http_upgrade $no_upgrade {
        "" 1;
        default 0;
    }

    # Только регулярные выражения "~": строки в map сравниваются без учёта регистра.
    map "$request_method $raw_path" $allow_fixed {
        default 0;
        "~^HEAD /api/yandex_smart_home/v1\.0$" 1;
        "~^GET /api/yandex_smart_home/v1\.0$" 1;
        "~^GET /api/yandex_smart_home/v1\.0/ping$" 1;
        "~^GET /api/yandex_smart_home/v1\.0/user/devices$" 1;
        "~^POST /api/yandex_smart_home/v1\.0/user/devices/query$" 1;
        "~^POST /api/yandex_smart_home/v1\.0/user/devices/action$" 1;
        "~^POST /api/yandex_smart_home/v1\.0/user/unlink$" 1;
        "~^POST /auth/token$" 1;
        include /tmp/agw/extra.map;
    }

    # Окно привязки: файл пуст, пока окно закрыто.
    map "$request_method $raw_path" $allow_window {
        default 0;
        include /tmp/agw/window.map;
    }

    # Итог: путь, схема, без Upgrade и (постоянный адрес без строки запроса или адрес окна).
    map "$path_ok$proto_ok$no_upgrade$allow_fixed$has_query$allow_window" $pass {
        "~^111(10.|..1)$" 1;
        default 0;
    }

    # Частота: вход и токен — по адресу клиента; прочее не ограничивается.
    map "$request_method $raw_path" $auth_limit_key {
        default "";
        "~^POST /auth/token$" $binary_remote_addr;
        "~^POST /auth/login_flow" $binary_remote_addr;
    }
    limit_req_zone $auth_limit_key zone=auth:1m rate=10r/m;
    limit_req_status 429;

    # Адрес для HA: частный, loopback, link-local, пустой — заглушка 198.51.100.1.
    map $remote_addr $client_for_ha {
        "~^(10|127|0)\." 198.51.100.1;
        "~^192\.168\." 198.51.100.1;
        "~^172\.(1[6-9]|2[0-9]|3[01])\." 198.51.100.1;
        "~^169\.254\." 198.51.100.1;
        "~*^(f[cd]|fe[89ab])[0-9a-f]*:" 198.51.100.1;
        "~*^::(1|ffff:.*)?$" 198.51.100.1;
        "" 198.51.100.1;
        default $remote_addr;
    }

    # Журнал без строки запроса; идентификатор вебхука скрыт (шаг 4: секрет в пути).
    map $raw_path $log_path {
        "~^/api/webhook/" "/api/webhook/***";
        default $raw_path;
    }
    map $request $log_method {
        "~^(?<m>[A-Z]+) " $m;
        default "-";
    }
    log_format gateway 'gw ra=$remote_addr m=$log_method path="$log_path" q=$has_query st=$status '
                       'pass=$pass t=$request_time ut=$upstream_response_time';
    access_log /dev/stdout gateway;

    server {
        listen 8090 default_server;

        error_page 403 429 502 504 /_empty;
        error_page 404 405 =403 /_empty;

        location = /_empty {
            internal;
            return 200 "";
        }

        location / {
            if ($pass = 0) {
                return 403;
            }
            limit_req zone=auth burst=5 nodelay;

            proxy_pass http://127.0.0.1:80;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Upgrade "";
            proxy_set_header Host "@PUBLIC_HOST@";
            proxy_set_header X-Forwarded-Host "@PUBLIC_HOST@";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $client_for_ha;
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_redirect off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
