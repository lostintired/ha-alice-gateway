# Зонд (задача 1.2): на любой запрос пустой 403, в журнал — заголовки адреса клиента.
# HA не проксируется. В журнал пишется сырой путь без строки запроса.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 128;
}

http {
    server_tokens off;
    default_type text/plain;
    client_max_body_size 16k;

    # Сырой путь клиента без "?…": параметры в журнал не попадают.
    map $request_uri $raw_path {
        "~^(?<p>[^?]*)" $p;
        default "-";
    }

    log_format probe 'probe ra=$remote_addr rp=$remote_port proto=$server_protocol '
                     'm=$request_method path="$raw_path" st=$status host="$host" '
                     'xri="$http_x_real_ip" xff="$http_x_forwarded_for" '
                     'xfp="$http_x_forwarded_proto" xfh="$http_x_forwarded_host" '
                     'fwd="$http_forwarded" via="$http_via" ua="$http_user_agent"';
    access_log /dev/stdout probe;

    server {
        listen 8090 default_server;

        # Пустое тело вместо стандартной страницы nginx; код остаётся 403.
        error_page 403 /_empty;
        error_page 404 =403 /_empty;

        location / {
            return 403;
        }

        location = /_empty {
            internal;
            return 200 "";
        }
    }
}
