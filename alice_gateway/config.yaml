name: Alice gateway
version: "0.2.1"
slug: alice_gateway
description: Allow-list nginx filter in front of Home Assistant for Yandex Smart Home
url: https://github.com/lostintired/ha-alice-gateway
arch:
  - amd64
init: false
startup: services
boot: auto
host_network: true
stdin: true
watchdog: tcp://[HOST]:8090
options:
  mode: probe
  public_host: ""
  linking_minutes: 15
  extra_paths: []
schema:
  mode: list(probe|gateway)
  public_host: str?
  linking_minutes: int(1,60)
  extra_paths:
    - path: str
      methods: str
